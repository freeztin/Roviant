<text x="62" y="191" fill="#f4f5ff" font-size="92" font-weight="700" letter-spacing="-5">Roviant<tspan fill="#7cf4cd">.</tspan></text>
<text x="67" y="240" fill="#c9cee1" font-size="23">Built around Linux. Designed for Wayland.</text>
<text x="68" y="277" fill="#8792ad" font-size="16">A Rust + GTK4 / libadwaita project for Roblox on Linux.</text>
