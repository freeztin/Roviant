 <radialGradient id="glow"><stop stop-color="#7260cc" stop-opacity=".22"/><stop offset="1" stop-color="#7260cc" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c0c7f0" stroke-opacity=".035"/></pattern>
</defs>
