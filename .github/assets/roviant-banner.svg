<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">Roviant — independent by design</title><desc id="desc">A mint and lavender Roviant emblem on a midnight background. Rust, GTK4, libadwaita. Built around Linux, designed for Wayland.</desc>
